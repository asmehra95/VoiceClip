[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceclip"
version = "1.0.0"
description = "Local voice-to-clipboard for macOS with a journal, reflections, daily summaries, research briefs, and a patterns coach."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "VoiceClip" }]
keywords = ["voice", "transcription", "whisper", "macos", "journaling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Core runtime deps — must stay in lock-step with requirements.txt so the
# curl|bash installer keeps working. Cloud LLM / multimodal deps stay
# opt-in via [project.optional-dependencies] below.
dependencies = [
    "mlx-whisper==0.4.3",
    "pynput==1.8.1",
    "sounddevice==0.5.5",
    "soundfile==0.13.1",
]

[project.optional-dependencies]
# Cloud LLM providers — only needed if the user flips summaries.provider
# / research.provider / patterns.provider to "openai" or "anthropic".
cloud = [
    "openai>=1.40",
    "anthropic>=0.40",
]
# Multimodal local models (Gemma 4, Gemma 3n, Qwen-VL). Only needed when
# the user picks one of those as a local_model.
vlm = [
    "mlx-vlm>=0.1.0",
]
# Dev tooling — lint, format, test. Install with:
#   ~/.voiceclip/.venv/bin/pip install -e '.[dev]'
# from a checkout.
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
voiceclip = "voiceclip.__main__:main"

[project.urls]
Homepage = "https://github.com/vtasing/voiceclip"

# ---------------------------------------------------------------------------
# setuptools — flat-layout discovery with explicit package so tests/ doesn't
# get picked up as a top-level package.
# ---------------------------------------------------------------------------

[tool.setuptools]
packages = ["voiceclip"]
include-package-data = true

[tool.setuptools.package-data]
# models.json ships with the package so list_recommended_models() works
# after a `pip install .` without needing the source tree.
voiceclip = ["models.json", "static/*.html", "static/*.css", "static/*.js"]

# ---------------------------------------------------------------------------
# ruff — lint + format. Replaces the "would probably add flake8 + black
# someday" item; one tool, one config, fast enough to run on every save.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
# Exclude generated / vendored / env dirs
extend-exclude = [".venv", "__pycache__", ".pytest_cache", "Documents"]

[tool.ruff.lint]
# Start conservative. Each rule set is a single letter prefix:
#   E,W = pycodestyle errors/warnings
#   F   = pyflakes (undefined names, unused imports)
#   I   = isort (import ordering)
#   B   = flake8-bugbear (likely bugs)
#   UP  = pyupgrade (modernize syntax)
#   SIM = flake8-simplify (readability)
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

ignore = [
    # Line too long — we wrap where it helps readability and let the rest
    # breathe. Not every 102-char line needs manual reformatting.
    "E501",
    # Ambiguous variable name (l, I, O) — project has none intentionally,
    # but the rule trips on harmless locals.
    "E741",
    # Allow `if x == None` style in tests where readability > strictness.
    "E711",
    # Don't force `typing.Optional` rewrites in files that still mix
    # 3.9-compat style with `X | None`. We'll unify when 3.9 support drops.
    "UP007",
    # Allow `dict()` / `list()` constructor style — occasionally clearer.
    "C408",
    # contextlib.suppress(X) rewrites — the explicit try/except/pass form
    # is equally readable and avoids one more import. Cosmetic rule.
    "SIM105",
    # if-else -> ternary rewrites — sometimes the block form reads better
    # with an inline comment. Cosmetic.
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
# Test files get more leeway: unused imports for fixture side effects,
# long lines in assertion messages, etc.
"tests/*" = ["F401", "F811", "E501"]
# __init__.py re-exports — unused imports are the whole point.
"voiceclip/__init__.py" = ["F401"]
# NamedTemporaryFile(delete=False) is the right call when the file must
# outlive the `with` block (passed to an external process / mlx_whisper).
# A context manager would destroy it before the consumer can read it.
"voiceclip/recorder.py" = ["SIM115"]
"voiceclip/transcriber.py" = ["SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["voiceclip"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------------------------------------------------------------------
# pytest — discovered automatically, but pinning the conftest path and
# adding a quiet default keeps the CI invocation a one-liner.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# -ra = short summary of everything except passes. Helpful when a test
# xfails / skips so we notice rather than silently passing.
addopts = "-ra"
